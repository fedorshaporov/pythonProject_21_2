<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <title>Каталог</title>
    <style>
        /* Высота бокового меню на 100% всей видимости */
        .bg-dark {
            height: 100vh; /* Высота 100% от видимой области */
            border-top-left-radius: 10px; /* Закругление верхнего левого угла */
            border-bottom-left-radius: 10px; /* Закругление нижнего левого угла */
        }
        /* Закругленные углы для карточек */
        .card {
            border-radius: 10px; /* Закругление для карточки */
        }
        /* Серый фон для заголовка товара */
        .product-title {
            background-color: #f8f9fa; /* Серый фон для заголовка */
            padding: 10px; /* Отступы вокруг заголовка */
            border-radius: 10px 10px 0 0; /* Закругление верхней части заголовка */
        }
        /* Кнопка "View" и "Edit" */
        .btn-custom {
            color: blue; /* Синий цвет текста */
            border: none; /* Убрали рамки */
            margin-right: 10px; /* Отступ между кнопками */
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Боковое меню -->
        <div class="col-md-2 d-flex flex-column flex-shrink-0 p-3 text-white bg-dark">
            <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
                <span class="fs-4">Меню</span>
            </a>
            <hr>
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item">
                    <a href="#" class="nav-link">Главная</a>
                </li>
                <li>
                    <a href="#" class="nav-link active" aria-current="page">Каталог</a> <!-- Активная страница каталога 1 -->
                </li>
                <li>
                    <a href="#" class="nav-link">Заказы</a>
                </li>
                <li>
                    <a href="#" class="nav-link">Контакты</a>
                </li>
            </ul>
            <hr>

            <!-- Информация о пользователе -->
            <div class="mt-auto text-center">
                <img src="https://github.com/mdo.png" alt="Пользователь" width="50" height="50" class="rounded-circle mb-2">
                <strong>mdo</strong>
            </div>
        </div>

        <!-- Центральная колонка -->
        <div class="col-md-10 p-3">
            <h1 class="text-center">Каталог</h1>
            <p class="text-center">Выберите товар из каталога.</p>

            <!-- Карточки с товарами -->
            <div class="row mt-4">
                <div class="col-md-6 mb-4"> <!-- Первая карточка -->
                    <div class="card">
                        <div class="img-container">
                            <div class="product-title">
                                <img src="https://via.placeholder.com/150" class="card-img-top" alt="Товар 1"> <!-- Изображение вместо заголовка -->
                            </div>
                        </div>
                        <div class="card-body">
                            <p class="card-text">Описание товара 1.</p>
                            <button class="btn btn-custom">View</button>
                            <button class="btn btn-custom">Edit</button>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 mb-4"> <!-- Вторая карточка -->
                    <div class="card">
                        <div class="img-container">
                            <div class="product-title">
                                <img src="https://via.placeholder.com/150" class="card-img-top" alt="Товар 2"> <!-- Изображение вместо заголовка -->
                            </div>
                        </div>
                        <div class="card-body">
                            <p class="card-text">Описание товара 2.</p>
                            <button class="btn btn-custom">View</button>
                            <button class="btn btn-custom">Edit</button>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 mb-4"> <!-- Третья карточка -->
                    <div class="card">
                        <div class="img-container">
                            <div class="product-title">
                                <img src="https://via.placeholder.com/150" class="card-img-top" alt="Товар 3"> <!-- Изображение вместо заголовка -->
                            </div>
                        </div>
                        <div class="card-body">
                            <p class="card-text">Описание товара 3.</p>
                            <button class="btn btn-custom">View</button>
                            <button class="btn btn-custom">Edit</button>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 mb-4"> <!-- Четвертая карточка -->
                    <div class="card">
                        <div class="img-container">
                            <div class="product-title">
                                <img src="https://via.placeholder.com/150" class="card-img-top" alt="Товар 4"> <!-- Изображение вместо заголовка -->
                            </div>
                        </div>
                        <div class="card-body">
                            <p class="card-text">Описание товара 4.</p>
                            <button class="btn btn-custom">View</button>
                            <button class="btn btn-custom">Edit</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha384-KyZXEAg3QhqLMpG8r+Knujsl5/8g2f5p9fFAyG0GCGJieUN9Blp1K5yD0T/2T+H9" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-T425Cem4PKF3a62fdZzkC8m4/UomKkfp9P1ff6/doc8N4h4pcDQ3rn+0h54Yi5bKn" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js" integrity="sha384-pzjw8f+ya6F2U+BC7O+6b0Ash1LzZXDJWgLVBLi73xi8ydZSF4W5/AZqecCGb1Ai" crossorigin="anonymous"></script>

</body>
</html>
