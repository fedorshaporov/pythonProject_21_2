<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <title>Главная</title>
    <style>
        /* Стили для главной страницы */
        .bg-dark {
            height: 100vh; /* Высота 100% от видимой области */
            border-top-left-radius: 10px;
            border-bottom-left-radius: 10px;
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Боковое меню -->
        <div class="col-md-2 d-flex flex-column flex-shrink-0 p-3 text-white bg-dark">
            <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
                <span class="fs-4">Меню</span>
            </a>
            <hr>
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item">
                    <a href="#" class="nav-link active" aria-current="page">Главная</a>
                </li>
                <li>
                    <a href="/contacts" class="nav-link">Контакты</a> <!-- Ссылка на контакты -->
                </li>
                <li>
                    <a href="/catalog" class="nav-link">Каталог</a> <!-- Ссылка на каталог -->
                </li>
                <li>
                    <a href="/category" class="nav-link">Категория</a> <!-- Ссылка на категорию -->
                </li>
            </ul>
            <hr>

            <!-- Информация о пользователе -->
            <div class="mt-auto text-center">
                <img src="https://github.com/mdo.png" alt="Пользователь" width="50" height="50" class="rounded-circle mb-2">
                <strong>mdo</strong>
            </div>
        </div>

        <!-- Центральная колонка -->
        <div class="col-md-10 p-3 text-center">
            <h1>Добро пожаловать на наш сайт!</h1>
            <p>Выберите одно из следующих действий:</p>
            <div class="mt-4">
                <a href="/contacts" class="btn btn-primary">Связаться с нами</a>  <!-- Кнопка на страницу контактов -->
                <a href="/catalog" class="btn btn-primary">Перейти в каталог</a> <!-- Кнопка на страницу каталога -->
                <a href="/category" class="btn btn-primary">Просмотреть категорию</a> <!-- Кнопка на страницу категории -->
            </div>
        </div>

    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha384-KyZXEAg3QhqLMpG8r+Knujsl5/8g2f5p9fFAyG0GCGJieUN9Blp1K5yD0T/2T+H9" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-T425Cem4PKF3a62fdZzkC8m4/UomKkfp9P1ff6/doc8N4h4pcDQ3rn+0h54Yi5bKn" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js" integrity="sha384-pzjw8f+ya6F2U+BC7O+6b0Ash1LzZXDJWgLVBLi73xi8ydZSF4W5/AZqecCGb1Ai" crossorigin="anonymous"></script>

</body>
</html>
