<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <title>Контакты</title>
    <style>
        /* Высота бокового меню на 100% всей видимости */
        .bg-dark {
            height: 100vh; /* Высота 100% от видимой области */
            border-top-left-radius: 10px; /* Закругление верхнего левого угла */
            border-bottom-left-radius: 10px; /* Закругление нижнего левого угла */
        }
        /* Закругленные углы для карточек */
        .card {
            border-radius: 10px; /* Закругление для карточки */
        }
        /* Кнопка "Отправить" с белым фоном и синим текстом */
        .btn-custom {
            background-color: white; /* Белый фон для кнопки */
            color: blue; /* Синий цвет текста */
            border: 1px solid blue; /* Синий цвет рамки */
        }
        .btn-custom:hover {
            background-color: blue; /* Синий фон при наведении */
            color: white; /* Белый цвет текста при наведении */
        }
        /* Ширина кнопки "Отправить" равная ширине формы */
        .btn-full-width {
            width: 100%; /* Полная ширина */
        }
        /* Центрирование заголовка и описания */
        .text-center {
            text-align: center; /* Центрирование текста */
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Боковое меню -->
        <div class="col-md-2 d-flex flex-column flex-shrink-0 p-3 text-white bg-dark">
            <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
                <span class="fs-4">Меню</span>
            </a>
            <hr>
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item">
                    <a href="#" class="nav-link">Главная</a>
                </li>
                <li>
                    <a href="#" class="nav-link">Категории</a>
                </li>
                <li>
                    <a href="#" class="nav-link">Заказы</a>
                </li>
                <li>
                    <a href="#" class="nav-link active" aria-current="page">Контакты</a> <!-- Активная страница контактов -->
                </li>
            </ul>
            <hr>

            <!-- Информация о пользователе -->
            <div class="mt-auto text-center">
                <img src="https://github.com/mdo.png" alt="Пользователь" width="50" height="50" class="rounded-circle mb-2">
                <strong>mdo</strong>
            </div>
        </div>

        <!-- Центральная колонка -->
        <div class="col-md-10 p-3">
            <h1 class="text-center">Контакты</h1> <!-- Центрирование заголовка -->
            <p class="text-center">Свяжитесь с нами с помощью формы ниже:</p> <!-- Центрирование описания -->

            <div class="row mt-4">
                <div class="col-md-6">
                    <div class="card mb-4">
                        <div class="card-body">
                            <form>
                                <div class="form-group">
                                    <label for="name">Имя</label>
                                    <input type="text" class="form-control" id="name" placeholder="Введите ваше имя">
                                </div>
                                <div class="form-group">
                                    <label for="email">Почта</label>
                                    <input type="email" class="form-control" id="email" placeholder="Введите вашу почту @example.com">
                                </div>
                                <div class="form-group">
                                    <label for="message">Сообщение</label>
                                    <textarea class="form-control" id="message" rows="3" placeholder="Введите ваше сообщение"></textarea>
                                </div>
                                <button type="submit" class="btn btn-custom btn-full-width">Отправить</button>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="card mb-4">
                        <div class="card-body">
                            <h5 class="card-title">Наши Контакты</h5>
                            <p>Телефон: +1 (234) 567-8901</p>
                            <p>Email: contact@example.com</p>
                            <p>Адрес: 123 Main St, City, Country</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha384-KyZXEAg3QhqLMpG8r+Knujsl5/8g2f5p9fFAyG0GCGJieUN9Blp1K5yD0T/2T+H9" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-T425Cem4PKF3a62fdZzkC8m4/UomKkfp9P1ff6/doc8N4h4pcDQ3rn+0h54Yi5bKn" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js" integrity="sha384-pzjw8f+ya6F2U+BC7O+6b0Ash1LzZXDJWgLVBLi73xi8ydZSF4W5/AZqecCGb1Ai" crossorigin="anonymous"></script>

</body>
</html>
